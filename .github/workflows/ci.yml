name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test mailbox, CLI, symlinks, and ignore rules
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Lint and check Python formatting
        env:
          RUFF_VERSION: '0.12.7'
          RUFF_SHA256: 65b1ec7ba8feda6cbe52aec168f32e5c276577065914fca922b9a8b3f42db433
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ruff.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${RUFF_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/notedrop-ruff"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/notedrop-ruff" --strip-components=1
          "${RUNNER_TEMP}/notedrop-ruff/ruff" check notedrop tests .github/scripts
          "${RUNNER_TEMP}/notedrop-ruff/ruff" format --check notedrop tests .github/scripts
      - name: Test review authorization and freshness
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check immutable action references
        run: python3 .github/scripts/check_workflow_pinning.py
      - name: Validate workflow syntax and embedded shell
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/notedrop-actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/notedrop-actionlint" actionlint
          "${RUNNER_TEMP}/notedrop-actionlint/actionlint" -color

  ci:
    # Keep one stable required check when the test matrix changes.
    if: always()
    needs: [tests, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "${TESTS_RESULT}" = success
          test "${QUALITY_RESULT}" = success
